services:
  db:
    ports: !reset []

  backend:
    ports: !reset []
    environment:
      # Active les contrôles de production du backend : refus de démarrer si JWT_SECRET est
      # absent ou trop court (< 32 caractères), CORS limité au domaine public.
      NODE_ENV: production
      # Lien public des devis envoyés par email/WhatsApp (sinon http://localhost:8090).
      FRONTEND_URL: https://${DOMAIN}

  frontend:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  caddy_data:
  caddy_config:
