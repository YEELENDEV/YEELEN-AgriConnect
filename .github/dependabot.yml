# Dependabot ouvre chaque semaine des pull requests de mise à jour, et immédiatement une PR
# dès qu'une vulnérabilité connue touche une dépendance. Chaque PR passe la CI complète.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/" # frontend + outils de contrôle
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Les mises à jour mineures et correctives regroupées en une seule PR, pour ne pas noyer
      # le dépôt ; les montées de version majeures restent séparées (à relire une par une).
      mineures:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/server"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      mineures:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: "/server"
    schedule:
      interval: monthly
