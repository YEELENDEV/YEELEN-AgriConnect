server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ne pas exposer la version de nginx (pages d'erreur, en-tête Server).
    server_tokens off;

    # NB : nginx n'hérite PAS des add_header du bloc server dans un bloc location qui déclare
    # ses propres add_header — les en-têtes de sécurité sont donc répétés dans chaque location.
    # En production, Caddy (voir Caddyfile) pose en plus HSTS et la CSP devant ce serveur.

    # Fichiers hashés par Vite (assets/*) : le nom change à chaque build,
    # donc un cache long et immuable est sans risque.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html référence le bundle hashé courant : ne doit jamais être mis
    # en cache, sinon un navigateur peut rester bloqué sur une ancienne
    # version de l'app après un déploiement tant qu'il ne force pas un
    # rechargement complet.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
